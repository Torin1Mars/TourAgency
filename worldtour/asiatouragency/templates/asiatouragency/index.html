{% load static %}
<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asia Tour Schedule</title>
    <link rel="stylesheet" href= "{%static 'styles/styles.css' %}">
</head>
<body>
<h1>Asia tour schedule for June 2024</h1>

<script src = "{%static 'js/script.js' %}"></script>
<img src = "{%static 'images/dlogo.png' %}" alt = "Django logo">

<ul>
    {% for tour in tours %}
    <li>{{ tour }}</li>
    {% empty %}
    <li>No tours scheduled for this month.</li>
    {% endfor %}
</ul>
</body>
</html>
