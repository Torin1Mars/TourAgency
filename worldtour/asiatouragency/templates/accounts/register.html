{%load static%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register page</title>
    <link rel="stylesheet" type="text/css" href="{% static 'styles/styles.css'%}">
</head>
<body>
    <div class = "container" >
        <h2>Registration</h2>

            {% form.as_p %}
            <button type="submit"> Register </button>
        </form>
    </div>
</body>
</html>
