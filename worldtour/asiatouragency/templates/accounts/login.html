{%load static%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loging page</title>
    <link rel="stylesheet" type="text/css" href="{% static 'styles/styles.css'%}">

{%comment%} Style for error message{%endcomment%}
    <style>
        .error{
            color:red
        }
    </style>
</head>
<body>
<div class = "container" >
    <h2>Loging</h2>
    <form method="post" action="{%url 'login' %}">
        {% csrf_token %}
        {%comment%} Hidden input{%comment%}
        <input type="hidden" name="text" value="{%next%}">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" required>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="text" name="password" id="password" required>
        </div>
    <button type="submit">Logging</button>
    </form>

    {%comment%} Checking for errors {%endcomment%}
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <p>Don't have account ? <a href="{% url 'register' %}">Register Here</a></p>
</div>
</body>
</html>
